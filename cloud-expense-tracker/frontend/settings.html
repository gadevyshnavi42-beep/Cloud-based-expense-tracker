<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="settings">
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<h1 class="h4 mb-3">Settings</h1>
<div class="card" style="max-width:520px"><div class="card-body"><form id="settingsForm">
  <div class="mb-3"><label class="form-label" for="currency">Currency</label><select class="form-select" id="currency"><option value="INR">Indian Rupee (&#8377;)</option><option value="USD">US Dollar ($)</option><option value="EUR">Euro (&euro;)</option><option value="GBP">British Pound (&pound;)</option></select></div>
  <div class="mb-3"><label class="form-label" for="dateFormat">Date format</label><select class="form-select" id="dateFormat"><option value="DD/MM/YYYY">DD/MM/YYYY</option><option value="MM/DD/YYYY">MM/DD/YYYY</option><option value="YYYY-MM-DD">YYYY-MM-DD</option></select></div>
  <button class="btn btn-primary" type="submit">Save settings</button></form>
  <hr><p class="small text-muted mb-2">Account settings such as name and password are on the <a href="profile.html">Profile</a> page.</p>
  <button class="btn btn-outline-danger btn-sm" id="logoutBtn2">Log out</button></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
