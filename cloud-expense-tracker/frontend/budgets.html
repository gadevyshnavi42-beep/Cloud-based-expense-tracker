<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgets | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<h1 class="h4 mb-3">Budgets</h1>
<div class="card mb-4"><div class="card-body"><form id="budgetForm" class="row g-2 align-items-end" novalidate>
  <div class="col-md-3"><label class="form-label" for="category">Category</label><select class="form-select" id="category"></select></div>
  <div class="col-md-3"><label class="form-label" for="month">Month</label><input type="month" class="form-control" id="month" required></div>
  <div class="col-md-3"><label class="form-label" for="monthlyLimit">Monthly limit (&#8377;)</label><input type="number" class="form-control" id="monthlyLimit" min="1" step="0.01" required></div>
  <div class="col-md-3"><button class="btn btn-primary" type="submit" id="saveBtn">Save Budget</button> <button class="btn btn-outline-secondary d-none" type="button" id="cancelEdit">Cancel</button></div>
</form><div class="form-text mt-2">Choose "Overall" for a whole-month budget. Only one budget is allowed per category per month.</div></div></div>
<div class="d-flex align-items-center gap-2 mb-3"><label for="viewMonth" class="mb-0">Showing:</label><input type="month" id="viewMonth" class="form-control w-auto"></div>
<div class="row g-3" id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/budgets.js"></script>
</body>
</html>
