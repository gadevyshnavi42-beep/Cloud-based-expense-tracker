<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Transaction | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4">
<h1 class="h4 mb-3" id="heading">Add Transaction</h1>
<form id="txForm" class="row g-3" novalidate>
  <div class="col-md-6"><label class="form-label" for="type">Type</label><select class="form-select" id="type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
  <div class="col-md-6"><label class="form-label" for="amount">Amount (&#8377;)</label><input type="number" class="form-control" id="amount" min="0.01" step="0.01" required></div>
  <div class="col-12"><label class="form-label" for="title">Description</label><input class="form-control" id="title" maxlength="100" required></div>
  <div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category"></select></div>
  <div class="col-md-6"><label class="form-label" for="transactionDate">Date</label><input type="date" class="form-control" id="transactionDate" required></div>
  <div class="col-md-6"><label class="form-label" for="paymentMethod">Payment method</label><select class="form-select" id="paymentMethod"></select></div>
  <div class="col-12"><label class="form-label" for="notes">Notes (optional)</label><textarea class="form-control" id="notes" rows="2" maxlength="500"></textarea></div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Save</button> <a class="btn btn-outline-secondary" href="transactions.html">Cancel</a></div>
</form></div></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/add-transaction.js"></script>
</body>
</html>
