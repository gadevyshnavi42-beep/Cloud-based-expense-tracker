<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div class="container"><div class="card auth-card"><div class="card-body p-4">
  <h1 class="h4 text-center mb-1"><i class="bi bi-wallet2 text-primary"></i> Login</h1>
  <p class="text-center text-muted small mb-4">Cloud-Based Expense Tracker</p>
  <form id="loginForm" novalidate><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" required autocomplete="email"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100" type="submit">Login</button></form>
  <p class="text-center small mt-3 mb-0">New here? <a href="register.html">Create an account</a></p>
  <p class="text-center small mt-2 mb-0"><a href="index.html">&larr; Back to home</a></p>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
