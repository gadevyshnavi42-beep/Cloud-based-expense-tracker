<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<h1 class="h4 mb-3">Reports</h1>
<div class="card mb-4"><div class="card-body">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2"><h2 class="h6 mb-0">Yearly report (month by month)</h2>
    <div class="d-flex gap-2"><label class="visually-hidden" for="year">Year</label><input type="number" class="form-control" id="year" min="2000" max="2100" style="width:110px"><button class="btn btn-primary" id="yearBtn">Show</button></div></div>
  <div class="chart-box mb-3"><canvas id="yearChart"></canvas></div>
  <div class="table-responsive"><table class="table table-sm"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr></thead><tbody id="yearRows"></tbody></table></div>
</div></div>
<div class="card"><div class="card-body">
  <h2 class="h6">Date range report</h2>
  <form id="rangeForm" class="row g-2 align-items-end mb-3">
    <div class="col-6 col-md-3"><label class="form-label small" for="from">From</label><input type="date" class="form-control" id="from" required></div>
    <div class="col-6 col-md-3"><label class="form-label small" for="to">To</label><input type="date" class="form-control" id="to" required></div>
    <div class="col-md-6"><button class="btn btn-primary" type="submit">Generate</button> <button class="btn btn-outline-primary" type="button" id="exportBtn"><i class="bi bi-download"></i> Export CSV</button></div>
  </form>
  <div class="row text-center mb-3"><div class="col"><div class="small text-muted">Income</div><div class="h5 text-income" id="rIncome">-</div></div><div class="col"><div class="small text-muted">Expenses</div><div class="h5 text-expense" id="rExpense">-</div></div><div class="col"><div class="small text-muted">Net</div><div class="h5" id="rNet">-</div></div></div>
  <div class="row g-3"><div class="col-md-5"><div class="chart-box"><canvas id="catChart"></canvas></div></div>
  <div class="col-md-7"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Category</th><th>Count</th><th>Total</th><th>Share</th></tr></thead><tbody id="catRows"></tbody></table></div></div></div>
</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
