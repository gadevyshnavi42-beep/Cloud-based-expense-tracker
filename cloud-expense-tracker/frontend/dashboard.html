<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
  <h1 class="h4 mb-0">Dashboard</h1>
  <div><label class="visually-hidden" for="month">Month</label><input type="month" id="month" class="form-control"></div>
</div>
<div id="alerts"></div>
<div class="row g-3 mb-3">
<div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <div class="stat-icon bg-income-soft"><i class="bi bi-arrow-down-circle"></i></div>
      <div><div class="small text-muted">Income (this month)</div><h2 class="h5 mb-0" id="income">-</h2></div></div></div></div><div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <div class="stat-icon bg-expense-soft"><i class="bi bi-arrow-up-circle"></i></div>
      <div><div class="small text-muted">Expenses (this month)</div><h2 class="h5 mb-0" id="expense">-</h2></div></div></div></div><div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <div class="stat-icon bg-accent-soft"><i class="bi bi-wallet2"></i></div>
      <div><div class="small text-muted">Net for month</div><h2 class="h5 mb-0" id="net">-</h2><div class="small text-muted" id="allTime"></div></div></div></div></div><div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <div class="stat-icon bg-warn-soft"><i class="bi bi-piggy-bank"></i></div>
      <div><div class="small text-muted">Budget used</div><h2 class="h5 mb-0" id="budgetText">-</h2><div class="small text-muted" id="budgetSub"></div></div></div></div></div>
</div>
<div class="row g-3 mb-3">
  <div class="col-lg-5"><div class="card h-100"><div class="card-body"><h2 class="h6">Expenses by category</h2><div id="catEmpty"></div><div class="chart-box"><canvas id="catChart"></canvas></div></div></div></div>
  <div class="col-lg-7"><div class="card h-100"><div class="card-body"><h2 class="h6">Income vs expenses (last 6 months)</h2><div class="chart-box"><canvas id="trendChart"></canvas></div></div></div></div>
</div>
<div class="row g-3">
  <div class="col-lg-8"><div class="card"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h6">Recent transactions</h2><a href="transactions.html" class="small">View all</a></div>
    <div class="table-responsive"><table class="table align-middle mb-0"><caption class="visually-hidden">Recent transactions</caption><tbody id="recent"></tbody></table></div></div></div></div>
  <div class="col-lg-4"><div class="card"><div class="card-body"><h2 class="h6">Top spending categories</h2><ul class="list-group list-group-flush" id="top"></ul></div></div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
