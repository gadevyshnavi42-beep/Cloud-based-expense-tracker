<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="profile">
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<h1 class="h4 mb-3">Profile</h1>
<div class="row g-3"><div class="col-md-6"><div class="card"><div class="card-body"><h2 class="h6">Your details</h2>
  <form id="profileForm" novalidate>
    <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" maxlength="50" required></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" disabled></div>
    <button class="btn btn-primary" type="submit">Update profile</button></form></div></div></div>
<div class="col-md-6"><div class="card"><div class="card-body"><h2 class="h6">Change password</h2>
  <form id="passwordForm" novalidate>
    <div class="mb-3"><label class="form-label" for="currentPassword">Current password</label><input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required></div>
    <div class="mb-3"><label class="form-label" for="newPassword">New password</label><input type="password" class="form-control" id="newPassword" autocomplete="new-password" minlength="8" required></div>
    <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm new password</label><input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" required></div>
    <button class="btn btn-primary" type="submit">Change password</button></form></div></div></div></div>
<button class="btn btn-outline-danger mt-3" id="logoutBtn2"><i class="bi bi-box-arrow-right"></i> Log out</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
