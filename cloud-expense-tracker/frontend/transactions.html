<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transactions | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
<div id="nav"></div>
<main class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h4 mb-0">Transactions</h1>
  <div><button class="btn btn-outline-primary btn-sm me-1" id="exportBtn"><i class="bi bi-download"></i> Export CSV</button><a class="btn btn-primary btn-sm" href="add-transaction.html"><i class="bi bi-plus-lg"></i> Add</a></div></div>
<div class="card mb-3"><div class="card-body"><form id="filterForm" class="row g-2">
  <div class="col-md-4"><label class="form-label small" for="search">Search description</label><input class="form-control" id="search" maxlength="50" placeholder="e.g. lunch"></div>
  <div class="col-6 col-md-2"><label class="form-label small" for="type">Type</label><select class="form-select" id="type"><option value="">All</option><option value="income">Income</option><option value="expense">Expense</option></select></div>
  <div class="col-6 col-md-3"><label class="form-label small" for="category">Category</label><select class="form-select" id="category"></select></div>
  <div class="col-6 col-md-3"><label class="form-label small" for="from">From</label><input type="date" class="form-control" id="from"></div>
  <div class="col-6 col-md-3"><label class="form-label small" for="to">To</label><input type="date" class="form-control" id="to"></div>
  <div class="col-6 col-md-3"><label class="form-label small" for="sortBy">Sort by</label><select class="form-select" id="sortBy"><option value="transactionDate">Date</option><option value="amount">Amount</option></select></div>
  <div class="col-6 col-md-2"><label class="form-label small" for="order">Order</label><select class="form-select" id="order"><option value="desc">Newest / High</option><option value="asc">Oldest / Low</option></select></div>
  <div class="col-md-4 d-flex align-items-end gap-2"><button class="btn btn-primary" type="submit">Apply</button><button class="btn btn-outline-secondary" type="button" id="reset">Reset</button></div>
</form></div></div>
<div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle">
  <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Payment</th><th class="text-end">Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="d-flex justify-content-between align-items-center"><span class="small text-muted" id="pageInfo"></span>
  <div><button class="btn btn-sm btn-outline-primary" id="prev">Previous</button> <button class="btn btn-sm btn-outline-primary" id="next">Next</button></div></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
